name: Daily newspaper

on:
  schedule:
    # 07:00 Asia/Shanghai (23:00 UTC on the preceding day).
    - cron: '0 23 * * *'
    # Retry once at 08:47 Shanghai; existing editions skip without AI calls.
    - cron: '47 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-newspaper
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/cache/restore@v4
        with:
          path: |
            data/ai-cache
            data/article-pool.json
            data/background-candidates.json
          key: newspaper-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: newspaper-
      - name: Publish once per edition
        env:
          AI_ENABLED: ${{ vars.AI_ENABLED }}
          AI_TOKEN_BUDGET: ${{ vars.AI_TOKEN_BUDGET || '500000' }}
          AI_REVIEW_LIMIT: ${{ vars.AI_REVIEW_LIMIT || '12' }}
          AI_COMPARISON_LIMIT: ${{ vars.AI_COMPARISON_LIMIT || '12' }}
          BASE_URL: ${{ secrets.BASE_URL }}
          BASE_KEY_1: ${{ secrets.BASE_KEY_1 }}
          BASE_KEY_2: ${{ secrets.BASE_KEY_2 }}
          BASE_KEY_3: ${{ secrets.BASE_KEY_3 }}
          AI_MODEL: ${{ vars.AI_MODEL }}
        run: python scripts/daily_update.py
      - name: Discover primary materials for leading events
        continue-on-error: true
        timeout-minutes: 5
        run: python scripts/source_evidence.py
      - name: Preserve operator report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publication-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/update-report.json
            data/update-report.md
            data/pending
            data/ai-budget-ledger.json
          retention-days: 30
          if-no-files-found: warn
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            data/ai-cache
            data/article-pool.json
            data/background-candidates.json
          key: newspaper-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save published data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/archive.json data/editions data/revisions data/last-update.json data/source-health.json
          for file in data/social-posts.json data/social-status.json data/opinion-posts.json data/ai-usage.json data/update-report.json data/update-report.md; do
            if [ -f "$file" ]; then git add "$file"; fi
          done
          if [ -d data/evidence ]; then git add data/evidence; fi
          if [ -d data/pending ]; then git add -A data/pending; fi
          if [ -f data/ai-budget-ledger.json ]; then git add data/ai-budget-ledger.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "Publish daily newspaper"
            git push origin HEAD:main
          fi
  # GITHUB_TOKEN pushes do not start the push workflow; invoke deployment explicitly.
  deploy:
    needs: publish
    uses: ./.github/workflows/pages.yml
